      options: ["Reactors generate neutrons through chemical reactions", "Synchrotrons produce highly collimated, intense (brilliant) X-ray beams", "Spallation sources use high-energy proton bombardment of a heavy-metal target", "Beamtime is normally requested through a short proposal, reviewed roughly twice a year"],
      correct: [1, 2, 3],
      why: "B, C, and D describe how these facilities work and how access is granted. A is false — reactors produce neutrons by nuclear fission, not chemistry." },
    { topic: "X-ray & Neutron Interactions",
      lead: "Neutrons and X-rays are genuinely different probes, exploited deliberately.",
      q: "Which statements about neutrons and X-rays are correct?",
      options: ["Both the neutron and the X-ray photon are electrically neutral", "The neutron has a magnetic moment and can scatter from magnetic structures", "The neutron has mass; the X-ray photon is effectively massless", "Neutrons interact mainly with nuclei (and magnetic moments); X-rays interact mainly with electrons"],
      correct: [0, 1, 2, 3],
      why: "All four are correct. A–C describe key differences that make the probes complementary; D is a shared property (both are neutral) that matters when comparing them to charged particles." },
    { topic: "Diffraction",
      lead: "Clean diffraction data is as much about practical care as about physics.",
      q: "Which of the following are genuine challenges/considerations in diffraction experiments?",
      options: ["The need to deuterate every X-ray sample", "Sample preparation and purity", "Detector calibration", "Bragg's law is independent of the wavelength of the radiation used"],
      correct: [1, 2],
      why: "B and C are standard experimental challenges. A is false — deuteration is a neutron (SANS) tool, not a routine X-ray requirement. D is false — Bragg's law explicitly involves wavelength." },
    { topic: "Small-Angle Scattering",
      lead: "Small-angle intensity depends on several physical and instrumental factors.",
      q: "Which factors influence the measured intensity/contrast in small-angle scattering?",
      options: ["The contrast between the phases", "Isotopic substitution (e.g. H/D) can change neutron contrast", "The scattering-length-density distribution", "The instrument resolution"],
      correct: [0, 1, 2, 3],
      why: "All four are correct. A–C shape the signal directly; D is a practical contrast tool widely used in neutron SANS." },
    { topic: "Inelastic Scattering & Spectroscopy",
      lead: "Time-of-flight (TOF) spectrometers are a major way to measure dynamics in materials.",
      q: "Which of the following are advantages of time-of-flight (TOF) spectrometers?",
      options: ["They can avoid using both a monochromator and an analyser", "They give access to wide regions of (Q, ω) space", "They are only suitable for purely elastic scattering", "They can be built in direct- or indirect-geometry configurations"],
      correct: [0, 1, 3],
      why: "A, B, and D are real strengths of TOF instruments, which use neutron arrival time to encode energy. C is false — TOF is used precisely to measure inelastic (energy-changing) processes." },
    { topic: "Imaging & Tomography",
      lead: "Modern imaging beamlines offer several complementary contrast mechanisms.",
      q: "Which contrast mechanisms are available in X-ray and/or neutron imaging?",
      options: ["Phase contrast", "Spin-polarisation contrast available for X-rays", "Attenuation contrast", "All imaging methods require a fully monochromatic beam to produce any contrast"],
      correct: [0, 2],
      why: "A and C are widely used for both X-rays and neutrons. Attenuation includes both absorption and scattering — for neutrons these are often comparable, so it is important to distinguish attenuation from absorption alone. B is false — spin-polarisation imaging is neutron-only. D is false — broadband attenuation imaging is common." },
    { topic: "MRI & Diffusion Imaging",
      lead: "Diffusion MRI interprets water motion to infer tissue microstructure.",
      q: "Which statements about diffusion MRI are correct?",
      options: ["The b-value sets the amount of diffusion weighting", "Free diffusion has an isotropic, Gaussian displacement distribution", "Diffusion tensor imaging (DTI) uses diffusion weighting along multiple directions", "Restricted diffusion along axons is anisotropic"],
      correct: [0, 1, 2, 3],
      why: "All four are correct descriptions of diffusion behaviour, weighting and how anisotropy is mapped in practice." },
    { topic: "Radiation Safety, Detectors & Activation",
      lead: "Material choice and procedures keep neutron instruments safe and functional.",
      q: "Which of the following are appropriate for neutron detection and/or safety?",
      options: ["Nickel is an ideal neutron-absorbing detector material", "Cadmium is used for shielding because of its high neutron absorption", "Boron and lithium are used for their high neutron-absorption cross-sections", "Radiation monitoring and controlled-access zones are essential safety measures"],
      correct: [1, 2, 3],
      why: "B, C, and D are correct. A is false — nickel is prized for reflecting/guiding neutrons (neutron guides), not absorbing them; good absorbers are B, Li, Cd and Gd." }
  ]
};

const LETTERS = ["A","B","C","D","E","F"];

function shuffleOptions(item) {
  const order = item.options.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  const old = item.options;
  item.options = order.map(i => old[i]);
  const set = new Set(item.correct);
  const nc = [];
  order.forEach((orig, pos) => { if (set.has(orig)) nc.push(pos); });
  item.correct = nc.sort((a, b) => a - b);
}
function shuffleMode(m) { QUESTIONS[m].forEach(shuffleOptions); }
// Options are pre-shuffled in QUESTIONS; shuffle only on retry.

let mode = "single";
let idx = 0;
let view = "intro";
let answered = {};   // key `${mode}-${idx}` -> { selection:[], correct:bool }
let scores = { single: 0, multi: 0 };

const quizArea = document.getElementById("quizArea");
const counter = document.getElementById("counter");
const scoreLabel = document.getElementById("scoreLabel");
const timerLabel = document.getElementById("timerLabel");
const progress = document.getElementById("progress");

let partATimerActive = false;
let partATimerSeconds = 0;
let partATimerInterval = null;

function formatTimer(totalSeconds) {
  const neutrons = Math.floor(totalSeconds / 60);
  const xrays = totalSeconds % 60;
  if (neutrons === 0) return `${xrays} x-rays`;
  if (xrays === 0) return `${neutrons} neutrons`;
  return `${neutrons} neutrons and ${xrays} x-rays`;
}

function updateTimerDisplay() {
  if (!partATimerActive) return;
  timerLabel.textContent = formatTimer(partATimerSeconds);
}

function startPartATimer() {
  partATimerActive = true;
  partATimerSeconds = 0;
  if (partATimerInterval) clearInterval(partATimerInterval);
  timerLabel.hidden = false;
  updateTimerDisplay();
  partATimerInterval = setInterval(() => {
    partATimerSeconds++;
    if (mode === "single" && view !== "intro") updateTimerDisplay();
  }, 1000);
}

function syncTimerVisibility() {
  timerLabel.hidden = !(partATimerActive && mode === "single" && view !== "intro");
  if (!timerLabel.hidden) updateTimerDisplay();
}

document.querySelectorAll("#modeSeg button").forEach(btn => {
  btn.addEventListener("click", () => {
    stopSpeech();
    document.querySelectorAll("#modeSeg button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    mode = btn.dataset.mode;
    idx = 0;
    view = "intro";
    tempSelection = [];
    render();
  });
});

function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  const sa = [...a].sort(), sb = [...b].sort();
  return sa.every((v, i) => v === sb[i]);
}

const ICON_LISTEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>';

function stopSpeech() {
  if (window.speechSynthesis) speechSynthesis.cancel();
}

function speakable(s) {
  return String(s)
    .replace(/H₂O/g, "H 2 O")
    .replace(/D₂O/g, "D 2 O")
    .replace(/³He/g, "helium-3")
    .replace(/⁶Li/g, "lithium-6")
    .replace(/¹⁰B/g, "boron-10")
    .replace(/¹H/g, "hydrogen-1")
    .replace(/→/g, " to ")
    .replace(/σ/g, " sigma ")
    .replace(/π/g, " pi ")
    .replace(/θ/g, " theta ")
    .replace(/λ/g, " lambda ")
    .replace(/ω/g, " omega ")
    .replace(/ρ/g, " rho ")
    .replace(/γ/g, " gamma ")
    .replace(/²/g, " squared")
    .replace(/⁴/g, " to the four")
    .replace(/₀/g, " zero")
    .replace(/₂/g, " 2")
    .replace(/⁻/g, " minus ")
    .replace(/≈/g, " approximately ")
    .replace(/∝/g, " proportional to ")
    .replace(/—/g, ", ")
    .replace(/–/g, "-")
    .replace(/·/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function questionSpeechText(item, state) {
  const parts = [
    `Topic: ${item.topic}.`,
    item.lead,
    item.q,
  ];
  if (mode === "multi") parts.push("Select all that apply.");
  item.options.forEach((opt, i) => {
    parts.push(`Option ${LETTERS[i]}: ${opt}.`);
  });
  if (state) {
    const correctLetters = item.correct.map(c => LETTERS[c]).join(", ");
    parts.push(state.correct ? "Correct!" : "Not quite.");
    parts.push(`Correct answer${item.correct.length > 1 ? "s" : ""}: ${correctLetters}.`);
    parts.push(item.why);
  }
  return parts.map(speakable).join(" ");
}

function speakQuestion(item, state, btn) {
  if (!window.speechSynthesis) {
    alert("Text-to-speech is not supported in this browser.");
    return;
  }
  if (speechSynthesis.speaking) {
    stopSpeech();
    if (btn) {
      btn.classList.remove("speaking");
      btn.innerHTML = ICON_LISTEN;
      btn.setAttribute("aria-label", "Listen to this question");
      btn.title = "Listen";
    }
    return;
  }
  const utter = new SpeechSynthesisUtterance(questionSpeechText(item, state));
  utter.lang = "en-GB";
  utter.rate = 0.95;
  utter.onend = () => {
    if (btn) {
      btn.classList.remove("speaking");
      btn.innerHTML = ICON_LISTEN;
      btn.setAttribute("aria-label", "Listen to this question");
      btn.title = "Listen";
    }
  };
  if (btn) {
    btn.classList.add("speaking");
    btn.innerHTML = ICON_STOP;
    btn.setAttribute("aria-label", "Stop reading");
    btn.title = "Stop";
  }
  speechSynthesis.speak(utter);
}

function formatText(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/�/g, "&mdash;")
    .replace(/—/g, "&mdash;")
    .replace(/–/g, "&ndash;")
    .replace(/·/g, "&middot;")
    .replace(/→/g, "&rarr;")
    .replace(/σ/g, "&sigma;")
    .replace(/π/g, "&pi;")
    .replace(/θ/g, "&theta;")
    .replace(/λ/g, "&lambda;")
    .replace(/ω/g, "&omega;")
    .replace(/ρ/g, "&rho;")
    .replace(/γ/g, "&gamma;")
    .replace(/²/g, "&sup2;")
    .replace(/₀/g, "&#8320;")
    .replace(/₂/g, "&#8322;")
    .replace(/⁻/g, "&#8315;")
    .replace(/⁴/g, "&#8308;")
    .replace(/⁶/g, "&#8309;")
    .replace(/⁹/g, "&#8313;")
    .replace(/⁰/g, "&#8304;")
    .replace(/¹/g, "&sup1;")
    .replace(/−/g, "&minus;")
    .replace(/≈/g, "&asymp;")
    .replace(/∝/g, "&prop;")
    .replace(/ï¿½/g, "&mdash;");
}

function renderIntro() {
  const isSingle = mode === "single";
  const total = QUESTIONS[mode].length;
  counter.textContent = isSingle ? "Part A" : "Part B";
  scoreLabel.textContent = "";
  syncTimerVisibility();
  progress.style.width = "0%";
  const title = isSingle ? "Part A · Single answer" : "Part B · Multiple answers";
  const summary = isSingle
    ? `${total} questions across the nine course topics.`
    : `${total} questions, one per course topic.`;
  const lines = isSingle ? [
    "Four answer options per question; exactly one is correct.",
    "Read the short note before each question.",
    "After answering, read the explanation to see why."
  ] : [
    "Four answer options per question; two or more may be correct.",
    "Select all answers you think are right, then press Check.",
    "After checking, read the explanation to see why."
  ];
  quizArea.innerHTML = `<div class="card intro">
      <span class="topic-tag">${title}</span>
      <h2>How it works</h2>
      <p class="intro-note">${summary}</p>
      <ul>${lines.map(l => `<li>${l}</li>`).join("")}</ul>
      <p class="intro-note">Your score is shown at the top as you go.</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="nav" id="startBtn">Start ${isSingle ? "Part A" : "Part B"} &rarr;</button>
      </div>
    </div>`;
  document.getElementById("startBtn").addEventListener("click", () => {
    stopSpeech();
    Object.keys(answered).forEach(k => { if (k.startsWith(mode + "-")) delete answered[k]; });
    scores[mode] = 0; idx = 0; tempSelection = []; view = "quiz";
    if (isSingle) startPartATimer();
    render();
  });
}

function render() {
  if (view === "intro") { renderIntro(); return; }
  const list = QUESTIONS[mode];
  if (idx >= list.length) { renderResults(); return; }
  const item = list[idx];
  const key = `${mode}-${idx}`;
  const state = answered[key];

  counter.textContent = `Question ${idx + 1} of ${list.length}`;
  scoreLabel.textContent = `Score: ${scores[mode]} / ${list.length}`;
  syncTimerVisibility();
  progress.style.width = `${(idx / list.length) * 100}%`;

  let html = `<div class="card">
    <span class="topic-tag">${item.topic}</span>
    <div class="speak-wrap"><button class="speak" id="speakBtn" type="button" aria-label="Listen to this question" title="Listen">${ICON_LISTEN}</button></div>
    <p class="lead">${formatText(item.lead)}</p>
    <p class="question">${formatText(item.q)}</p>`;
  if (mode === "multi") html += `<p class="hint">Select all that apply, then press Check.</p>`;
  html += `<div class="options">`;

  item.options.forEach((opt, i) => {
    let cls = "option";
    if (state) {
      cls += " locked";
      if (item.correct.includes(i)) cls += " correct";
      else if (state.selection.includes(i)) cls += " wrong";
    } else if (mode === "multi" && tempSelection.includes(i)) {
      cls += " selected";
    }
    html += `<button class="${cls}" data-i="${i}">
        <span class="letter">${LETTERS[i]}</span>
        <span>${formatText(opt)}</span>
      </button>`;
  });
  html += `</div>`;

  if (state) {
    const cls = state.correct ? "good" : "bad";
    const verdict = state.correct ? "Correct!" : "Not quite.";
    const correctLetters = item.correct.map(c => LETTERS[c]).join(", ");
    html += `<div class="explanation ${cls}">
        <strong>${verdict}</strong> Correct answer${item.correct.length>1?'s':''}: ${correctLetters}.<br>${formatText(item.why)}
      </div>`;
  }

  html += `<div class="btn-row">
      <button class="nav ghost" id="prevBtn" ${idx === 0 ? "disabled" : ""}>&larr; Previous</button>`;
  if (!state && mode === "multi") {
    html += `<button class="nav" id="checkBtn">Check answer</button>`;
  } else if (state) {
    html += `<button class="nav" id="nextBtn">${idx === list.length - 1 ? "See results" : "Next &rarr;"}</button>`;
  } else {
    html += `<span></span>`;
  }
  html += `</div></div>`;

  quizArea.innerHTML = html;

  quizArea.querySelectorAll(".option").forEach(b => {
    b.addEventListener("click", () => onOptionClick(parseInt(b.dataset.i)));
  });
  const prevBtn = document.getElementById("prevBtn");
  if (prevBtn) prevBtn.addEventListener("click", () => { stopSpeech(); idx--; tempSelection = []; render(); });
  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", () => { stopSpeech(); idx++; tempSelection = []; render(); });
  const checkBtn = document.getElementById("checkBtn");
  if (checkBtn) checkBtn.addEventListener("click", commitMulti);
  const speakBtn = document.getElementById("speakBtn");
  if (speakBtn) speakBtn.addEventListener("click", () => speakQuestion(item, state, speakBtn));
}

let tempSelection = [];

function onOptionClick(i) {
  const key = `${mode}-${idx}`;
  if (answered[key]) return;          // locked
  if (mode === "single") {
    const item = QUESTIONS.single[idx];
    const correct = arraysEqual([i], item.correct);
    answered[key] = { selection: [i], correct };
    if (correct) scores.single++;
    render();
  } else {
    if (tempSelection.includes(i)) tempSelection = tempSelection.filter(x => x !== i);
    else tempSelection.push(i);
    render();
  }
}

function commitMulti() {
  const key = `${mode}-${idx}`;
  if (tempSelection.length === 0) return;
  const item = QUESTIONS.multi[idx];
  const correct = arraysEqual(tempSelection, item.correct);
  answered[key] = { selection: [...tempSelection], correct };
  if (correct) scores.multi++;
  render();
}

function renderResults() {
  const list = QUESTIONS[mode];
  progress.style.width = `100%`;
  counter.textContent = `Finished`;
  scoreLabel.textContent = `Score: ${scores[mode]} / ${list.length}`;
  syncTimerVisibility();
  const pct = Math.round((scores[mode] / list.length) * 100);
  let msg;
  if (pct === 100) msg = "Outstanding &mdash; full marks!";
  else if (pct >= 75) msg = "Great work &mdash; strong understanding.";
  else if (pct >= 50) msg = "Good start &mdash; review the explanations and retry.";
  else msg = "Keep going &mdash; revisit the material and try again.";
  quizArea.innerHTML = `<div class="card results">
      <span class="topic-tag">${mode === "single" ? "Part A · Single answer" : "Part B · Multiple answers"}</span>
      <div class="score">${pct}%</div>
      <p>You answered <strong>${scores[mode]}</strong> of <strong>${list.length}</strong> correctly.</p>
      ${mode === "single" && partATimerActive ? `<p>Time: <strong>${formatTimer(partATimerSeconds)}</strong></p>` : ""}
      <p>${msg}</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="nav" id="retryBtn">Try again</button>
        <button class="nav ghost" id="switchBtn">${mode === "single" ? "Go to Part B &rarr;" : "&larr; Back to Part A"}</button>
      </div>
    </div>`;
  document.getElementById("retryBtn").addEventListener("click", () => {
    stopSpeech();
    Object.keys(answered).forEach(k => { if (k.startsWith(mode + "-")) delete answered[k]; });
    scores[mode] = 0; idx = 0; tempSelection = []; shuffleMode(mode); view = "quiz"; render();
  });
  document.getElementById("switchBtn").addEventListener("click", () => {
    document.querySelector(`#modeSeg button[data-mode="${mode === "single" ? "multi" : "single"}"]`).click();
  });
}

render();
</script>
</body>
</html>
