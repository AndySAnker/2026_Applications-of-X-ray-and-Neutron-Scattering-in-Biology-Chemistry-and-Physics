<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidden SAXS analysis — quiz companion</title>
  <style>
    :root {
      --bg: #020617;
      --panel: #020617;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #020617 0%, #020617 45%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 18px 10px;
      text-align: center;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0 0 4px;
      font-size: 1rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    header p {
      margin: 0;
      font-size: 0.82rem;
      color: var(--muted);
    }
    header code {
      background: rgba(15, 23, 42, 0.9);
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      color: var(--accent);
      font-size: 0.78rem;
    }
    main {
      flex: 1;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .frame-wrap {
      flex: 1;
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(0,0,0,0.7);
      background: #020617;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #020617;
    }
    footer {
      padding: 10px 14px 16px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Hidden SAXS teaching tool</h1>
    <p>Companion view for <em>Applications of X-ray and Neutron Scattering</em> — not linked from the quiz UI.</p>
    <p><code>/Quiz_2026/saxs_analysis_hidden.html</code></p>
  </header>
  <main>
    <div class="frame-wrap">
      <iframe src="./SAXS_data_analysis/index.html" title="SAXS teaching app"></iframe>
    </div>
  </main>
  <footer>
    Direct URL only. Do not share this link with students if you want the analysis to stay hidden.
  </footer>
</body>
</html>
